name: Release Samba image and Helm chart

on:
  workflow_dispatch:
    inputs:
      samba_version:
        description: "Alpine Samba package version, e.g. 4.21.9-r1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: samba-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Validate requested package version
        env:
          VERSION: ${{ inputs.samba_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_ACCESS_TOKEN }}

      - name: Build and push standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/samba:${{ inputs.samba_version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/samba:latest
            quay.io/underndog/samba:${{ inputs.samba_version }}
            quay.io/underndog/samba:latest

      - name: Build and push no-recycle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.not_recycle
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/samba:${{ inputs.samba_version }}-not-recycle
            ${{ secrets.DOCKER_HUB_USERNAME }}/samba:latest-not-recycle
            quay.io/underndog/samba:${{ inputs.samba_version }}-not-recycle
            quay.io/underndog/samba:latest-not-recycle

      - name: Verify built Samba version
        env:
          VERSION: ${{ inputs.samba_version }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(docker run --rm "${{ secrets.DOCKER_HUB_USERNAME }}/samba:${VERSION}" sh -c 'smbd -V | awk "{print \$2}"')
          expected=${VERSION%-r*}
          test "$actual" = "$expected"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update and package Helm chart
        env:
          VERSION: ${{ inputs.samba_version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          chart = Path("helm-chart/samba-server/Chart.yaml")
          text = chart.read_text()
          for key, value in (("version", version), ("appVersion", f'"{version}"')):
              text, count = re.subn(rf"^{key}:.*$", f"{key}: {value}", text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"missing {key} in {chart}")
          chart.write_text(text)

          values = Path("helm-chart/samba-server/values.yaml")
          text = values.read_text()
          text, count = re.subn(r'^(  tag:) .*$', rf'\1 "{version}"', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("missing image.tag in values.yaml")
          values.write_text(text)
          PY
          helm lint helm-chart/samba-server
          helm template samba-server helm-chart/samba-server >/dev/null
          helm package helm-chart/samba-server --destination helm-chart
          helm repo index helm-chart --url "https://antiantiops.github.io/samba/helm-chart"
          mv helm-chart/index.yaml index.yaml

      - name: Commit chart release
        env:
          VERSION: ${{ inputs.samba_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-chart/samba-server/Chart.yaml helm-chart/samba-server/values.yaml helm-chart/samba-server-${VERSION}.tgz index.yaml
          git commit -m "chore: release samba ${VERSION} [skip ci]"
          git push origin HEAD:master
